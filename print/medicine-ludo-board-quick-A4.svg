<text x="14" y="254" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">ROLL — the die gives both your distance and your card. Answer right and move forward by the roll; answer wrong</text>
<text x="14" y="258.3" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">and move back half the roll, rounded down, never past your own START.</text>
<text x="14" y="264.2" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">PIECES — both of yours begin on your START square. Land on a square holding only opponents and they go back to</text>
<text x="14" y="268.5" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">their own START. The four ★ START squares are safe: nothing is captured there.</text>
<text x="14" y="274.4" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">WINNING — roll a 6 and answer correctly to go again, at most twice running. First player to get both pieces HOME</text>
<text x="14" y="278.7" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">wins; in 2v2 it is the first team with two pieces home between the partners.</text>
<text x="14" y="285.6" font-family="Helvetica,Arial,sans-serif"
       font-size="2.7" fill="#16123a" fill-opacity="0.55">7x7 · track 20 squares · home column 1 · 26mm cells — print at 100%, do NOT "fit to page" · medicine-ludo.charindith.workers.dev</text>
