<text x="18" y="337" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">ROLL — the die gives both your distance and your card. Answer right and move forward by the roll; answer wrong and move back half the roll, rounded down, never</text>
<text x="18" y="341.3" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">past your own START.</text>
<text x="18" y="347.2" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">PIECES — both of yours begin on your START square. Land on a square holding only opponents and they go back to their own START. The four ★ START squares are safe:</text>
<text x="18" y="351.5" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">nothing is captured there.</text>
<text x="18" y="357.4" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">WINNING — roll a 6 and answer correctly to go again, at most twice running. First player to get both pieces HOME wins; in 2v2 it is the first team with two pieces</text>
<text x="18" y="361.7" font-family="Helvetica,Arial,sans-serif"
           font-size="3.2" fill="#16123a">home between the partners.</text>
<text x="18" y="368.6" font-family="Helvetica,Arial,sans-serif"
       font-size="2.7" fill="#16123a" fill-opacity="0.55">9x9 · track 28 squares · home column 2 · 29mm cells — print at 100%, do NOT "fit to page" · medicine-ludo.charindith.workers.dev</text>
