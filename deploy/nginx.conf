# Dedicated vhost: existing sites and global nginx settings are untouched.
map $http_upgrade $medicine_ludo_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name medicine-ludo.jaindu.me;
    location /.well-known/acme-challenge/ { root /var/www/medicine-ludo-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name medicine-ludo.jaindu.me;
    ssl_certificate /etc/letsencrypt/live/medicine-ludo.jaindu.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medicine-ludo.jaindu.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log /var/log/nginx/medicine-ludo-access.log;
    error_log /var/log/nginx/medicine-ludo-error.log;
    # Avoid writing player IDs from WebSocket query parameters to logs.
    location = /ws {
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $medicine_ludo_connection;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
